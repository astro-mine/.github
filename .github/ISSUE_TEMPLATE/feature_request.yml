name: Feature request
description: Suggest a capability, plugin, or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For changes to `Astro-Mine-Core` interfaces, a new top-level package, or a breaking
        change, please open an [RFC](https://github.com/astro-mine/.github/blob/main/GOVERNANCE.md#the-rfc-process)
        instead of a feature request.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The motivation and use case. Who benefits and how?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. If it's a plugin, say which interfaces it targets.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - World & environment (Worlds / Prospect / Link)
        - Assets (Fleet)
        - Simulation (Sim / Surrogate)
        - Autonomy (Mind / Learn / Allocate / Guard)
        - Design & operations (Studio / Ops / Bridge / View)
        - Commons backbone (Core / Bench / Hub / Cloud)
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
